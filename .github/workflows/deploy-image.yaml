name: "Build and deploy container image"

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: "Get date time tag"
        run: echo "datetime_tag=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
      - name: "Build container image"
        run: |
          buildah bud \
            -t ${{ env.IMAGE }}:$(git rev-parse --short HEAD) \
            -t ${{ env.IMAGE }}:${{ env.datetime_tag }} \
            -t ${{ env.IMAGE }}:latest \
            -f Containerfile
      - name: "Login to the container registry"
        run: buildah login -u="${{ github.actor }}" -p="${{ secrets.GITHUB_TOKEN }}" ghcr.io
      - name: "Push container image"
        run: |
          buildah push ${{ env.IMAGE }}:$(git rev-parse --short HEAD)
          buildah push ${{ env.IMAGE }}:${{ env.datetime_tag }}
          buildah push ${{ env.IMAGE }}:latest
